name: PaperBoard prüfen
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testumgebung installieren
        run: python -m pip install pytest-homeassistant-custom-component Pillow==12.3.0
      - name: Python- und Home-Assistant-Tests
        run: python -m pytest -q
      - name: Editor prüfen
        run: node --test tests/editor.test.js
      - name: JavaScript-Syntax prüfen
        run: node --check custom_components/paperboard/frontend/panel.js
      - name: Vorschauen und Installationspakete prüfen
        run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: PaperBoard-gepruefte-Pakete
          path: dist/
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
