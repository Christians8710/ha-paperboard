name: PaperBoard prüfen
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testumgebung installieren
        run: python -m pip install pytest-homeassistant-custom-component==0.13.375 home-assistant-frontend==20260930.2 Pillow==12.3.0
      - name: Python- und Home-Assistant-Tests
        run: python -m pytest -q
      - name: Editor prüfen
        run: node --test tests/*.test.js
      - name: JavaScript-Syntax prüfen
        run: |
          node --check custom_components/paperboard/frontend/panel.js
          node --check custom_components/paperboard/frontend/installer-ui.js
          node --check custom_components/paperboard/frontend/flash.bundle.js
          node --check custom_components/paperboard/frontend/offline.bundle.js
      - name: Vorschauen und Installationspakete prüfen
        run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: PaperBoard-gepruefte-Pakete
          path: dist/
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install esphome==2026.10.1
      - name: E1002-Konfiguration und Codegenerierung prüfen
        run: python tools/check_firmware.py
